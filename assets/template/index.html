<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TALK TITLE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ONE SENTENCE: what the talk shows.">
<meta property="og:title" content="TALK TITLE">
<meta property="og:description" content="ONE SENTENCE for link previews. A narrated, animated story.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500&display=swap">
<style>
/* Layout: a design-review whiteboard for one talk. A 16:9 dotted stage that steps on click,
   with the narration set under it like a figure caption, and a rail of scenes above. */
:root{
  --bg:#F3F5F8; --paper:#FFFFFF; --panel:#F7F9FB; --fill:#EDF0F4; --grid:#DCE2E9;
  --ink:#131A24; --ink-2:#465264; --ink-3:#7F8A9A; --line:#DCE1E8; --line-2:#B6C0CD;
  --blue:#2459C7; --blue-soft:#E4ECFB; --blue-ink:#1B47A0;
  --orange:#CC5A1C; --orange-soft:#FBEADF; --orange-ink:#9E400D;
  --green:#1D8752; --green-soft:#E0F2E7; --green-ink:#14653D;
  --red:#CB3030; --red-soft:#FBE4E2; --red-ink:#A12222;
  --amber:#C68A08; --amber-soft:#FBF1D6; --amber-ink:#7E5600;
  --on-blue:#FFFFFF; --on-amber:#1E1600;
  --code-bg:#141A23; --code-bg-2:#1C2430; --code-line:#2E3947; --code-fg:#DCE3EC; --code-dim:#76839A;
  --code-kw:#F38BA8; --code-str:#94D3A2; --code-fn:#8CB8FF; --code-warn:#F2C25B; --code-bad:#F38078;
  --f-disp:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pw:min(100%, 1120px, max(620px, calc((100svh - 300px) * 16 / 9)));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F15; --paper:#11161E; --panel:#151B24; --fill:#1B222D; --grid:#1E2632;
    --ink:#E6EBF2; --ink-2:#AAB4C2; --ink-3:#717D8E; --line:#252E3B; --line-2:#3C4757;
    --blue:#6E9BFF; --blue-soft:#162443; --blue-ink:#B8CDFF;
    --orange:#F0884A; --orange-soft:#38200F; --orange-ink:#FFC6A0;
    --green:#46C487; --green-soft:#0F2C1D; --green-ink:#A6EBC6;
    --red:#F06B64; --red-soft:#3A1717; --red-ink:#FFB8B2;
    --amber:#EDB43C; --amber-soft:#36290A; --amber-ink:#FFDB8F;
    --on-blue:#0B0F15; --on-amber:#1E1600;
    --code-bg:#0A0E14; --code-bg-2:#121822; --code-line:#26303D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F15; --paper:#11161E; --panel:#151B24; --fill:#1B222D; --grid:#1E2632;
  --ink:#E6EBF2; --ink-2:#AAB4C2; --ink-3:#717D8E; --line:#252E3B; --line-2:#3C4757;
  --blue:#6E9BFF; --blue-soft:#162443; --blue-ink:#B8CDFF;
  --orange:#F0884A; --orange-soft:#38200F; --orange-ink:#FFC6A0;
  --green:#46C487; --green-soft:#0F2C1D; --green-ink:#A6EBC6;
  --red:#F06B64; --red-soft:#3A1717; --red-ink:#FFB8B2;
  --amber:#EDB43C; --amber-soft:#36290A; --amber-ink:#FFDB8F;
  --on-blue:#0B0F15; --on-amber:#1E1600;
  --code-bg:#0A0E14; --code-bg-2:#121822; --code-line:#26303D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 48px;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

/* top bar */
.bar{width:var(--pw);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding-block:16px 6px;font:500 12.5px/1.2 var(--f-mono);letter-spacing:.02em;color:var(--ink-3)}
.bar a{text-decoration:none;color:var(--ink-2)}
.bar a:hover{color:var(--ink)}

/* player */
.player{width:var(--pw);margin:0 auto}
.rail{display:flex;gap:12px;align-items:flex-end;margin:10px 0 10px}
.act{flex:var(--n) 1 0;min-width:0}
.act-name{font:500 11px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;transition:color .3s}
.act.cur .act-name{color:var(--ink)}
.segs{display:flex;gap:3px}
.seg{flex:1;height:16px;border:0;padding:0;background:none;cursor:pointer;position:relative;border-radius:4px}
.seg::before{content:"";position:absolute;left:0;right:0;bottom:4px;height:5px;border-radius:3px;background:var(--line)}
.seg i{position:absolute;left:0;right:0;bottom:4px;height:5px;border-radius:3px;background:var(--ink);
  transform-origin:left center;transform:scaleX(var(--p,0));transition:transform .45s cubic-bezier(.2,.75,.2,1)}
.seg:hover::before{background:var(--line-2)}

.stage{position:relative;width:100%;aspect-ratio:16/9;background-color:var(--paper);
  background-image:radial-gradient(circle, var(--grid) 1.1px, transparent 1.4px);background-size:24px 24px;background-position:12px 12px;
  border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;box-shadow:0 1px 0 rgba(0,0,0,.02), 0 18px 50px -30px rgba(20,30,50,.35)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;visibility:hidden;transform:scale(.965) translateY(12px);
  transition:opacity .5s ease, transform .85s cubic-bezier(.2,.75,.2,1), visibility 0s linear .6s}
.stage svg.active{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease .08s, transform 1s cubic-bezier(.2,.75,.2,1) .04s}
.stage svg.leaving{transform:scale(1.035)}
.stage.back svg{transform:scale(1.035)} .stage.back svg.active{transform:none} .stage.back svg.leaving{transform:scale(.965) translateY(12px)}
/* a slow camera push on the scene in view */
.cam{transform-origin:600px 338px}
.stage svg.active .cam{animation:cam 26s cubic-bezier(.3,0,.45,1) .2s both}
/* a scene that opens close up on its core, then pulls back */
.zoomout{transform-origin:600px 120px}
.stage svg.active .zoomout{animation:zoomout 1.9s cubic-bezier(.45,0,.2,1) .15s both}
@keyframes zoomout{from{transform:translate(0,190px) scale(2.3)}to{transform:none}}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.035)}}
/* the dot grid drifts while the story plays */
.stage.playing{animation:drift 14s linear infinite}
@keyframes drift{from{background-position:12px 12px}to{background-position:36px 36px}}
/* a section tag that slides in when a new part begins */
.flash{position:absolute;right:18px;top:14px;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 11px;border-radius:999px;
  background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(20,30,50,.45);
  font:600 12px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink);
  opacity:0;transform:translateX(18px);pointer-events:none;transition:opacity .45s ease, transform .7s cubic-bezier(.2,.75,.2,1)}
.flash i{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.flash.show{opacity:1;transform:none}
.tick{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--blue);transform-origin:left center;transform:scaleX(0);opacity:.85;pointer-events:none}
@keyframes tick{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hint{position:absolute;right:16px;bottom:14px;font:500 12.5px/1 var(--f-mono);color:var(--ink-3);background:var(--paper);
  border:1px solid var(--line);border-radius:20px;padding:7px 12px;pointer-events:none;transition:opacity .5s}
.hint.gone{opacity:0}

.below{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 28px;align-items:start;padding-top:18px}
.cap{min-width:0}
.eyebrow{margin:0 0 6px;font:500 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cap h2{margin:0 0 8px;font:700 clamp(21px, 2.3vw, 28px)/1.15 var(--f-disp);letter-spacing:-.01em;text-wrap:balance}
/* subtitles, on the picture like a video's, so the eye stays in one place */
/* The frame grows a strip at its foot for them: the scene keeps its full width above it and nothing is covered. */
.stage:not(.frame){aspect-ratio:16/10}
.stage:not(.frame) > svg{height:90%}
.stage.nosubs{aspect-ratio:16/9}
.stage.nosubs > svg{height:100%}
.narr{position:absolute;left:50%;bottom:1.6%;z-index:3;max-width:66%;margin:0;padding:.28em .75em;border-radius:8px;
  background:rgba(12,14,18,.8);color:#fff;font:500 clamp(13px, 1.65vw, 20px)/1.4 var(--f-body);text-align:center;
  text-wrap:balance;pointer-events:none;translate:-50% 0}
.narr:empty,.narr.off{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.narr.swap{animation:swap .45s ease}
@keyframes swap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ctrl{display:flex;align-items:center;gap:8px;padding-top:2px}
.ctrl button{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:42px;padding:0 12px;
  border-radius:21px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;
  transition:background .2s, border-color .2s, transform .1s}
.ctrl button:hover{border-color:var(--ink-3)}
.ctrl button:active{transform:scale(.97)}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl button svg{width:16px;height:16px;fill:currentColor}
.ctrl #play{background:var(--ink);border-color:var(--ink);color:var(--paper);padding:0 18px 0 15px;min-width:104px}
.count{font:500 13px/1 var(--f-mono);color:var(--ink-3);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.keys{grid-column:1 / -1;margin:0;font:500 12px/1.4 var(--f-mono);color:var(--ink-3)}
kbd{font:inherit;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-2)}

/* transcript */
.after{width:var(--pw);margin:36px auto 0;display:grid;gap:18px}
details.transcript{border-top:1px solid var(--line);padding-top:16px}
details.transcript summary{cursor:pointer;font:600 15px/1.4 var(--f-body);color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.transcript summary::-webkit-details-marker{display:none}
details.transcript summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--line-2);border-radius:50%;font:500 15px/1 var(--f-mono);color:var(--ink-3)}
details[open].transcript summary::before{content:"\2212"}
.tx{max-width:68ch;padding:8px 0 0 32px}
.tx section{margin:22px 0 0}
.tx h3{margin:0 0 6px;font:700 19px/1.25 var(--f-disp)}
.tx .act-h{margin:34px 0 0;font:500 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tx p{margin:0 0 10px;color:var(--ink-2)}
.tx .insight{margin:20px 0 22px;padding:4px 0 4px 20px;border-left:2px solid var(--blue);font:italic 450 22px/1.45 "Newsreader","Noto Serif SC","Songti SC",Georgia,serif;letter-spacing:-.005em;color:var(--ink)}
html[lang^="zh"] .tx .insight{font:500 19.5px/1.65 "Noto Serif SC","Songti SC",serif;letter-spacing:.01em}
.tx .cta-link{margin:16px 0 4px}
.tx .cta-link a{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line-2);border-radius:999px;font:600 14.5px/1.2 var(--f-body);color:var(--ink);text-decoration:none}
.tx .cta-link a:hover{border-color:var(--blue);color:var(--blue-ink)}
.tx .figcap{margin:2px 0 16px;font:400 13.5px/1.5 var(--f-body);color:var(--ink-3);text-align:center}
.tx ol{margin:0 0 12px;padding-left:1.4em;color:var(--ink-2)}
.tx li{margin:0 0 7px;padding-left:.2em}
/* a few still pictures at the turns of the story */
.tx .frame{margin:14px 0 6px;border-radius:12px;border:1px solid var(--line);overflow:hidden;cursor:default}
.tx .frame *{animation:none !important;transition:none !important}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font:500 12.5px/1.5 var(--f-mono);color:var(--ink-3);border-top:1px solid var(--line);padding-top:16px}
.foot a{text-decoration:none;color:var(--ink-2)}

@media (max-width:720px){
  .below{grid-template-columns:1fr}
  .ctrl{order:-1;justify-content:space-between}
  .ctrl #play{flex:1}
  .narr{max-width:88%;bottom:1.2%}
  .act-name{display:none}
  .act.cur .act-name{display:block;position:absolute;visibility:hidden}
  .keys{display:none}
  .stage{border-radius:12px}
  .hint{display:none}
  .tx{padding-left:0}
  .bar .meta{display:none}
  .below .rotate{display:block}
}
.rotate{display:none;margin:10px 0 0;font:500 12px/1.4 var(--f-mono);color:var(--ink-3)}
@media (orientation:landscape){.rotate{display:none !important}}
.bar a{white-space:nowrap}

/* ---------- stage drawing ---------- */
.stage text{font-family:var(--f-body);fill:var(--ink)}
.stage .ff-mono{font-family:var(--f-mono)}
.stage .ff-disp{font-family:var(--f-disp);letter-spacing:-.01em}
.c-ink{fill:var(--ink)} .c-ink2{fill:var(--ink-2)} .c-ink3{fill:var(--ink-3)} .c-paper{fill:var(--paper)} .c-line{fill:var(--line)} .c-line2{fill:var(--line-2)} .c-fill{fill:var(--fill)}
.c-blue{fill:var(--blue)} .c-orange{fill:var(--orange)} .c-green{fill:var(--green)} .c-red{fill:var(--red)} .c-amber{fill:var(--amber)}
.c-blue-ink{fill:var(--blue-ink)} .c-orange-ink{fill:var(--orange-ink)} .c-green-ink{fill:var(--green-ink)} .c-red-ink{fill:var(--red-ink)} .c-amber-ink{fill:var(--amber-ink)}
.c-blue-soft{fill:var(--blue-soft)} .c-orange-soft{fill:var(--orange-soft)} .c-green-soft{fill:var(--green-soft)} .c-red-soft{fill:var(--red-soft)} .c-amber-soft{fill:var(--amber-soft)}
.c-code-bg{fill:var(--code-bg)} .c-code-bg2{fill:var(--code-bg-2)} .c-code-fg{fill:var(--code-fg)} .c-code-dim{fill:var(--code-dim)} .c-code-kw{fill:var(--code-kw)}
.c-code-str{fill:var(--code-str)} .c-code-fn{fill:var(--code-fn)} .c-code-warn{fill:var(--code-warn)} .c-code-bad{fill:var(--code-bad)}
.stage .c-code-fg{fill:var(--code-fg)} .stage .c-code-dim{fill:var(--code-dim)} .stage .c-code-kw{fill:var(--code-kw)} .stage .c-code-str{fill:var(--code-str)}
.stage .c-code-fn{fill:var(--code-fn)} .stage .c-code-warn{fill:var(--code-warn)} .stage .c-code-bad{fill:var(--code-bad)}
.stage .c-ink2{fill:var(--ink-2)} .stage .c-ink3{fill:var(--ink-3)} .stage .c-paper{fill:var(--paper)}
.stage .c-blue{fill:var(--blue)} .stage .c-orange{fill:var(--orange)} .stage .c-green{fill:var(--green)} .stage .c-red{fill:var(--red)} .stage .c-amber{fill:var(--amber)}
.stage .c-blue-ink{fill:var(--blue-ink)} .stage .c-orange-ink{fill:var(--orange-ink)} .stage .c-green-ink{fill:var(--green-ink)} .stage .c-red-ink{fill:var(--red-ink)} .stage .c-amber-ink{fill:var(--amber-ink)}
.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ln.dash{stroke-dasharray:7 7}
.s-ink{stroke:var(--ink)} .s-ink2{stroke:var(--ink-2)} .s-ink3{stroke:var(--ink-3)} .s-line{stroke:var(--line)} .s-line2{stroke:var(--line-2)} .s-paper{stroke:var(--paper)}
.s-blue{stroke:var(--blue)} .s-orange{stroke:var(--orange)} .s-green{stroke:var(--green)} .s-red{stroke:var(--red)} .s-amber{stroke:var(--amber)}
.s-code-dim{stroke:var(--code-dim)} .s-code-line{stroke:var(--code-line)}

/* box kinds */
.k-card>rect,.k-card>circle{fill:var(--paper);stroke:var(--line-2);stroke-width:1.5}
.k-panel>rect{fill:var(--panel);stroke:var(--line);stroke-width:1}
.k-tile>rect,.k-tile>circle{fill:var(--fill);stroke:var(--line);stroke-width:1}
.k-core>rect,.k-core>circle{fill:var(--ink)} .stage .k-core text{fill:var(--paper)} .stage .k-core .bs{opacity:.72}
.k-design>rect{fill:var(--paper);stroke:var(--blue);stroke-width:1.75} .stage .k-design .bl{fill:var(--blue-ink)}
.k-ghost>rect{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:7 7} .stage .k-ghost text{fill:var(--ink-3)}
.k-blue>rect,.k-blue>circle{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5} .stage .k-blue .bl{fill:var(--blue-ink)}
.k-orange>rect,.k-orange>circle{fill:var(--orange-soft);stroke:var(--orange);stroke-width:1.5} .stage .k-orange .bl{fill:var(--orange-ink)}
.k-green>rect,.k-green>circle{fill:var(--green-soft);stroke:var(--green);stroke-width:1.5} .stage .k-green .bl{fill:var(--green-ink)}
.k-red>rect,.k-red>circle{fill:var(--red-soft);stroke:var(--red);stroke-width:1.5} .stage .k-red .bl{fill:var(--red-ink)}
.k-amber>rect,.k-amber>circle{fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.5} .stage .k-amber .bl{fill:var(--amber-ink)}
.k-solid-blue>rect,.k-solid-blue>circle{fill:var(--blue)} .stage .k-solid-blue text{fill:var(--on-blue)}
.k-solid-amber>rect{fill:var(--amber)} .stage .k-solid-amber text{fill:var(--on-amber)} .stage .k-solid-amber .bs{opacity:.8}
.k-solid-ink>rect{fill:var(--ink)} .stage .k-solid-ink text{fill:var(--paper)}
.k-ring-red>rect{fill:none;stroke:var(--red);stroke-width:3}
.k-ring-amber>rect{fill:none;stroke:var(--amber);stroke-width:2.5}
.k-code>rect{fill:var(--code-bg)}
.k-term>rect{fill:var(--code-bg-2);stroke:var(--code-line);stroke-width:1.2} .stage .k-term text{fill:var(--code-fg)}
.stage .bs{fill:var(--ink-2)}
.stage .k-red .bs,.stage .k-green .bs,.stage .k-blue .bs,.stage .k-orange .bs,.stage .k-amber .bs{fill:var(--ink-2)}
.cta{cursor:pointer}
.cta:hover>g>rect{filter:brightness(1.08)}

/* step animation */
.anim,.mv{transform-box:fill-box;transform-origin:center}
.anim{opacity:0;--dl:0s;transition:opacity .5s ease var(--dl), transform var(--tt,.75s) cubic-bezier(.2,.75,.2,1) var(--dl), stroke-dashoffset var(--dur,.9s) cubic-bezier(.45,0,.25,1) var(--dl)}
.anim.on{opacity:1;--dl:var(--d,0s)}
.fwd .anim:not(.on){--dl:var(--xd,0s)}
.rise{transform:translateY(16px)} .rise.on{transform:none}
.pop{transform:scale(.86)} .pop.on{transform:none}
.grow-x{transform:scaleX(0);transform-origin:0% 50%} .grow-x.on{transform:none}
.grow-y{transform:scaleY(0);transform-origin:50% 100%} .grow-y.on{transform:none}
.anim.draw{stroke-dasharray:1 1;stroke-dashoffset:1} .anim.draw.on{stroke-dashoffset:0}
.mv{--mdl:0s;transition:transform .95s cubic-bezier(.2,.75,.2,1) var(--mdl)}
.mv.moved{--mdl:var(--md,0s);transform:translate(var(--mx,0px),var(--my,0px)) scale(var(--ms,1))}
.on .spin,.on.spin{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center}
.on .pulse,.on.pulse{animation:pulse 1.25s ease-in-out calc(var(--d,0s) + .55s) 4}
.on .shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) var(--shd,1s) 2}
.ripple,.burst,.hop,.tremble{transform-box:fill-box;transform-origin:center}
.on .ripple,.on.ripple{animation:ripple 2.6s ease-out var(--rd,0s) infinite}
.on .burst{animation:ripple 1.1s ease-out var(--rd,0s) 1 both}
@keyframes ripple{from{transform:scale(.7);opacity:.8}to{transform:scale(2.8);opacity:0}}
.on .flow{stroke-dasharray:5 30;animation:flow 1.4s linear infinite}
.on .flow2{stroke-dasharray:6 22;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-35}}
svg[data-k="2"] .flow,svg[data-k="3"] .flow{animation-play-state:paused;opacity:.15}
.on .flash{animation:flash 1.4s ease-out .35s 1 both}
@keyframes flash{0%{opacity:0}18%{opacity:.22}100%{opacity:0}}
svg[data-k="2"] .quake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) .5s 2}
svg[data-k="0"] .hop,svg[data-k="1"] .hop,svg[data-k="3"] .hop3{animation:hop .8s ease-in-out infinite}
.hop3{transform-box:fill-box;transform-origin:center}
@keyframes hop{50%{transform:translateY(-9px)}}
svg[data-k="2"] .tremble,svg[data-k="3"] .tremble{animation:tremble .18s linear infinite}
@keyframes tremble{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.on .wiggle{transform-box:fill-box;transform-origin:50% 20%;animation:wiggle .9s ease-in-out calc(var(--d,0s) + .5s) 3}
@keyframes wiggle{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes pulse{50%{opacity:.25}}
.instant .anim,.instant .mv{transition:none !important}
.instant .pulse,.instant .spin,.instant .shake,.instant .wiggle{animation:none !important}

@media (prefers-reduced-motion: reduce){
  .anim,.mv{transition-duration:.01s !important;transition-delay:0s !important}
  .on .spin,.on.spin,.on .pulse,.on.pulse,.on .shake,.on .wiggle,.on .ripple,.on.ripple,.on .burst,.on .flow,.on .flow2,.on .flash,svg .quake,svg .hop,svg .tremble,.stage svg.active .cam,.stage svg.active .zoomout,.stage.playing{animation:none !important}
  .stage svg,.stage svg.active,.stage svg.leaving{transition:none;transform:none !important}
  .flash{transition:none}
  .narr.swap{animation:none}
}

:focus-visible{outline-color:var(--accent)}

/* ---------- full screen: the whole player (rail, stage, caption, controls) fills the screen ----------

.player.fs{position:fixed;inset:0;z-index:50;width:100%;height:100%;margin:0;overflow:auto;background:var(--bg);

<script>
"use strict";
/* ---------- SVG helpers. Every scene is drawn in a 1200 x 675 box. ----------
   s: visible from step s · x: hidden from step x · d: delay (s) · fx: rise|pop|draw|grow-x|grow-y
   m: moved from step m (mx, my, ms, md) · count/type: numbers that count, text that types */
const NS = "http://www.w3.org/2000/svg";
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function at(o = {}, base = "") {
  const isA = o.s != null || o.x != null;
  let a = "";
  if (o.s != null) a += ` data-s="${o.s}"`;
  if (o.x != null) a += ` data-x="${o.x}"`;
  if (o.m != null) a += ` data-m="${o.m}"`;
  if (o.count != null) a += ` data-count="${o.count}" data-from="${o.from ?? 0}" data-fmt="${esc(o.fmt || "{}")}" data-dur="${o.cdur || 1200}"`;
  if (o.type) a += ` data-type="1" data-dur="${o.tdur || 900}"`;
  if (o.act) a += ` data-act="${o.act}"`;
  let st = "";
  if (isA) st += `--d:${o.d || 0}s;`;
  if (o.xd) st += `--xd:${o.xd}s;`;
  if (o.dur) st += `--dur:${o.dur}s;`;
  if (o.tt) st += `--tt:${o.tt}s;`;
  if (o.m != null) st += `--mx:${o.mx || 0}px;--my:${o.my || 0}px;--ms:${o.ms ?? 1};--md:${o.md || 0}s;`;
  if (o.st) st += o.st;
  if (st) a += ` style="${st}"`;
  const c = [base, o.fx, o.m != null ? "mv" : "", o.c].filter(Boolean).join(" ");
  if (c) a += ` class="${c}"`;
  return a;
}
/* group; a group that both fades and moves is split in two, so the two transforms never fight */
function G(inner, o = {}) {
  const anim = o.s != null || o.x != null;
  if (o.m != null && anim) {
    const { m, mx, my, ms, md, ...rest } = o;
    return `<g${at(rest)}><g${at({ m, mx, my, ms, md })}>${inner}</g></g>`;
  }
  return `<g${at(o)}>${inner}</g>`;
}
function T(x, y, str, o = {}) {
  const lines = Array.isArray(str) ? str : [str];
  const size = o.size || 20, lh = (o.lh || 1.3) * size;
  const base = ["t", o.f && "ff-" + o.f, o.col && "c-" + o.col].filter(Boolean).join(" ");
  let a = ` x="${x}" y="${y}" font-size="${size}"`;
  if (o.a) a += ` text-anchor="${o.a}"`;
  if (o.w) a += ` font-weight="${o.w}"`;
  if (o.ls) a += ` letter-spacing="${o.ls}"`;
  if (o.it) a += ` font-style="italic"`;
  const fmt = l => (o.raw ? l : esc(l));
  const inner = lines.length === 1 ? fmt(lines[0])
    : lines.map((l, i) => `<tspan x="${x}" dy="${i ? lh : 0}">${fmt(l)}</tspan>`).join("");
  return `<text${a}${at(o, base)}>${inner}</text>`;
}
function B(x, y, w, h, label, o = {}) {
  const k = o.k || "card", r = o.r ?? 12, size = o.size || 20, ss = o.ss || Math.round(size * 0.78);
  const lines = label == null || label === "" ? [] : (Array.isArray(label) ? label : [label]);
  const sub = o.sub == null ? [] : (Array.isArray(o.sub) ? o.sub : [o.sub]);
  const lh = size * 1.22, slh = ss * 1.32, gap = sub.length && lines.length ? 5 : 0;
  const total = lines.length * lh + sub.length * slh + gap;
  let cy = y + h / 2 - total / 2;
  const left = o.a === "start", tx = left ? x + (o.pad ?? 18) : x + w / 2, anc = left ? "start" : "middle";
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"${o.dash ? ' stroke-dasharray="7 7"' : ""}/>`;
  const fmt = l => (o.raw ? l : esc(l));
  lines.forEach((l, i) => {
    const c = cy + lh * (i + 0.5);
    s += `<text class="t bl${o.f ? " ff-" + o.f : ""}" x="${tx}" y="${(c + size * 0.35).toFixed(1)}" font-size="${size}" font-weight="${o.w || 600}" text-anchor="${anc}">${fmt(l)}</text>`;
  });
  cy += lines.length * lh + gap;
  sub.forEach((l, i) => {
    const c = cy + slh * (i + 0.5);
    s += `<text class="t bs${o.sf ? " ff-" + o.sf : ""}" x="${tx}" y="${(c + ss * 0.35).toFixed(1)}" font-size="${ss}" text-anchor="${anc}">${fmt(l)}</text>`;
  });
  return `<g${at(o, "k-" + k)}>${s}${o.extra || ""}</g>`;
}
function P(d, o = {}) {
  const base = ["ln", "s-" + (o.col || "line2"), o.dash ? "dash" : ""].filter(Boolean).join(" ");
  let a = ` d="${d}"`;
  if (o.fx === "draw") a += ` pathLength="1"`;
  if (o.sw) a += ` stroke-width="${o.sw}"`;
  return `<path${a}${at(o, base)}/>`;
}
const L = (x1, y1, x2, y2, o = {}) => P(`M${x1} ${y1}L${x2} ${y2}`, o);
function head(x, y, deg, o = {}) {
  const z = o.hs || 12;
  return `<path d="M0 0L${-z} ${-z / 2}L${-z} ${z / 2}Z" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${deg.toFixed(1)})" class="c-${o.col || "ink"}"/>`;
}
function headAnim(o, extra) {
  if (o.s == null && o.x == null) return {};
  return { s: o.s, x: o.x, d: (o.d || 0) + (o.dash ? 0.2 : (o.dur || 0.9) * extra) };
}
function AR(x1, y1, x2, y2, o = {}) {
  const ang = Math.atan2(y2 - y1, x2 - x1), z = o.hs || 12;
  const ex = x2 - Math.cos(ang) * z * 0.8, ey = y2 - Math.sin(ang) * z * 0.8;
  const line = P(`M${x1} ${y1}L${ex.toFixed(1)} ${ey.toFixed(1)}`, { ...o, fx: o.fx ?? (o.dash ? undefined : "draw") });
  return line + G(head(x2, y2, ang * 180 / Math.PI, o), headAnim(o, 0.75));
}
function ARC(p, o = {}) {
  const [x1, y1, a, b, c, d, x2, y2] = p;
  const deg = Math.atan2(y2 - d, x2 - c) * 180 / Math.PI;
  const line = P(`M${x1} ${y1}C${a} ${b} ${c} ${d} ${x2} ${y2}`, { ...o, fx: o.fx ?? (o.dash ? undefined : "draw") });
  return line + G(head(x2, y2, deg, o), headAnim(o, 0.85));
}
const CK = (x, y, z = 14, col = "green", o = {}) =>
  P(`M${x - z * 0.5} ${y + z * 0.02}L${x - z * 0.14} ${y + z * 0.38}L${x + z * 0.55} ${y - z * 0.42}`, { sw: 3, ...o, col });
const XX = (x, y, z = 14, col = "red", o = {}) =>
  P(`M${x - z * 0.4} ${y - z * 0.4}L${x + z * 0.4} ${y + z * 0.4}M${x + z * 0.4} ${y - z * 0.4}L${x - z * 0.4} ${y + z * 0.4}`, { sw: 3, ...o, col });
function circ(cx, cy, r, o = {}) {
  return `<circle cx="${cx}" cy="${cy}" r="${r}"${at(o, o.k ? "" : "c-" + (o.col || "ink"))}/>`;
}
function badge(cx, cy, r, kind, o = {}) { // filled disc with a check or a cross
  const disc = `<circle cx="${cx}" cy="${cy}" r="${r}" class="c-${kind === "ok" ? "green" : kind === "bad" ? "red" : "amber"}"/>`;
  const mark = kind === "ok" ? CK(cx, cy, r * 0.95, "paper", { sw: 2.6 }) : XX(cx, cy, r * 0.85, "paper", { sw: 2.6 });
  return G(disc + mark, o);
}
function cycle(cx, cy, r, col, sw = 3) { // a round arrow, for "it changes"
  const a0 = -50 * Math.PI / 180, a1 = 230 * Math.PI / 180;
  const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 1 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" class="ln s-${col}" stroke-width="${sw}"/>` +
    head(x1, y1, a1 * 180 / Math.PI + 90, { col, hs: r * 0.62 });
}
function warn(cx, cy, z = 18, col = "red") { // warning triangle
  return `<path d="M${cx} ${cy - z * 0.62}L${cx + z * 0.62} ${cy + z * 0.48}L${cx - z * 0.62} ${cy + z * 0.48}Z" class="c-${col}" stroke-linejoin="round"/>` +
    `<rect x="${cx - 1.4}" y="${cy - z * 0.24}" width="2.8" height="${z * 0.42}" rx="1.2" class="c-paper"/>` +
    `<circle cx="${cx}" cy="${cy + z * 0.3}" r="1.7" class="c-paper"/>`;
}
function codeWall(x, y, w, h, seed = 7, rows = 30) { // a minimap of a large file
  let r = seed;
  const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  const lh = (h - 28) / rows;
  let s = "";
  for (let i = 0; i < rows; i++) {
    let cx = x + 18 + Math.floor(rnd() * 4) * 16;
    const yy = y + 16 + i * lh, n = 1 + Math.floor(rnd() * 3);
    for (let j = 0; j < n && cx < x + w - 40; j++) {
      const ww = Math.min(x + w - 18 - cx, 18 + rnd() * 120);
      const c = ["c-code-dim", "c-code-kw", "c-code-str", "c-code-fn"][rnd() < 0.55 ? 0 : 1 + Math.floor(rnd() * 3)];
      s += `<rect x="${cx.toFixed(1)}" y="${yy.toFixed(1)}" width="${ww.toFixed(1)}" height="${(lh * 0.46).toFixed(1)}" rx="2" class="${c}" opacity=".7"/>`;
      cx += ww + 8;
    }
  }
  return s;
}
function pointer(x, y) { // mouse cursor, tip at (x, y)
  return `<path d="M${x} ${y}l0 24l6.5 -6l4.6 10l4 -1.8l-4.5 -9.8l8.6 0z" class="c-ink" stroke="var(--paper)" stroke-width="1.6" stroke-linejoin="round"/>`;
}
/* ---------- the story ---------- */
/* Acts group scenes on the rail. RAIL holds the short names shown above the stage. */
const ACTS = ["The problem", "The idea", "Takeaways"];
const RAIL = ["Problem", "Idea", "Wrap-up"];
/* parallel parts (practices, steps of a method): title, the question it answers, the known technique it comes from */
const PARTS = [
  ["Part title as a short imperative", "The question this part answers?", "known technique"]
];
const SCENES = [];
const scene = o => SCENES.push(o);
/* a chapter card for part n (0-based): give its scene an id starting with "practice-" so the act flash stays quiet */
function chapter(n) {
  let s = "";
  s += T(600, 420, String(n + 1), { f: "disp", size: 400, w: 800, a: "middle", st: "fill:var(--line);fill-opacity:.5", s: 0, fx: "pop", tt: 1.6 });
  s += T(600, 170, `PART ${n + 1} OF ${PARTS.length} · FROM ${PARTS[n][2].toUpperCase()}`, { f: "mono", size: 15, a: "middle", col: "blue-ink", ls: 1.6, s: 0, d: 0.15 });
  s += T(600, 262, PARTS[n][0], { f: "disp", size: 46, w: 750, a: "middle", s: 0, d: 0.3, fx: "rise", tt: 1 });
  s += T(600, 320, PARTS[n][1], { size: 23, a: "middle", col: "ink2", s: 0, d: 0.8, type: true, tdur: 1300 });
  return s;
}

/* Every scene keeps exactly this shape: the voice and Chinese build scripts find scenes by it.
     id: "x", act: N, title: "...",
     steps: [ one narration string per step ],
     svg() { ... }                                                           */

/* 0 · title */
scene({
  id: "start", act: 0, title: "TALK TITLE",
  steps: [
    "The opening line names the reader's problem in their own words, then asks the one question the talk answers."
  ],
  svg() {
    let s = "";
    s += T(78, 184, ["TALK TITLE", "ON TWO LINES"], { f: "disp", size: 58, w: 750, lh: 1.1, s: 0, d: 0.1, fx: "rise" });
    s += T(82, 316, ["One line of context, at most two."], { size: 21, col: "ink2", lh: 1.45, s: 0, d: 0.35 });
    s += T(82, 412, ["The question the talk answers?"], { f: "disp", size: 27, w: 700, lh: 1.3, s: 0, d: 0.55, fx: "rise" });
    const btn = B(80, 520, 236, 58, "Play the story", { k: "solid-blue", r: 29, size: 20, a: "start", pad: 58 }) +
      `<path d="M104 537v24l20-12z" class="c-paper"/>`;
    s += G(btn, { s: 0, d: 0.7, act: "play", c: "cta" });
    // a small picture of the problem, drawn in
    s += B(800, 170, 260, 70, "Core idea", { k: "core", size: 22, s: 0, d: 0.35, fx: "pop" });
    s += G(G(cycle(1092, 205, 16, "orange"), { c: "spin" }), { s: 0, d: 0.5 });
    [820, 930, 1040].forEach((cx, i) => {
      s += L(930, 240, cx, 320, { s: 0, d: 0.55 + i * 0.05, fx: "draw", dur: 0.5 });
      s += B(cx - 50, 320, 100, 48, "Part", { k: "design", size: 18, s: 0, d: 0.75 + i * 0.06, fx: "pop" });
    });
    return s;
  }
});

/* 1 · one idea, shown as a mechanism over four steps */
scene({

    else if (voiceOn && clipKey === clipOf(cur, step) && !audio.ended && audio.currentTime > 0) { if (audio.paused) audio.play().catch(() => {}); }
    else speak();
    playing = true; setPlayUI(); arm(); seen(); musicOn();
  }
  function pause() { playing = false; clearTimeout(timer); tickBar.style.animation = "none"; audio.pause(); musicOff(last() ? 3 : 1); setPlayUI(); }

  /* background music: a seamless loop that starts with the voice, whether the talk
     plays itself or is stepped by hand, and dips while the voice speaks. Stepped by
     hand, it fades out a while after the last clip ends. */
  const MUS = 0.2, DUCK = 0.1, IDLE = 9000;
  let actx = null, mgain = null, msrc = null, mbuf = null, mload = null, mwant = false, midle = 0;
  function fade(v, sec) {
    const t = actx.currentTime;
    mgain.gain.cancelScheduledValues(t);
    mgain.gain.setValueAtTime(mgain.gain.value, t);
    mgain.gain.linearRampToValueAtTime(v, t + sec);
  }
  async function musicOn() {
    if (!voiceOn) return;
    mwant = true; clearTimeout(midle);
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      actx = new C(); mgain = actx.createGain(); mgain.gain.value = 0; mgain.connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
    if (!mbuf) {
      mload = mload || fetch("music.m4a").then(r => r.arrayBuffer())
        .then(b => new Promise((ok, no) => actx.decodeAudioData(b, ok, no))).then(b => { mbuf = b; }).catch(() => {});
      await mload;
      if (!mbuf || !mwant || !voiceOn) return;
    }
    if (!msrc) { msrc = actx.createBufferSource(); msrc.buffer = mbuf; msrc.loop = true; msrc.connect(mgain); msrc.start(); }
    fade(audio.paused ? MUS : DUCK, 1.6);
  }
  function musicOff(sec) { mwant = false; clearTimeout(midle); if (actx) fade(0, sec); }
  const musicIdle = () => { if (!playing) { clearTimeout(midle); midle = setTimeout(() => musicOff(3), IDLE); } };
  audio.addEventListener("play", () => { if (mwant && msrc) fade(DUCK, 0.35); });
  audio.addEventListener("ended", () => { if (mwant && msrc) { fade(MUS, 0.9); musicIdle(); } });
  audio.addEventListener("error", () => { if (mwant) musicIdle(); });
  function setSndUI() {
    sndIcon.innerHTML = voiceOn ? SND_ON : SND_OFF;
    btnSnd.setAttribute("aria-pressed", voiceOn ? "true" : "false");
    btnSnd.setAttribute("aria-label", voiceOn ? "Sound on" : "Sound off");
    btnSnd.title = voiceOn ? "Sound on: voice and music (M)" : "Sound off (M)";
  }
  function toggleVoice() {
    voiceOn = !voiceOn; voiceBad = false;
    try { localStorage.setItem("agwd-voice", voiceOn ? "on" : "off"); } catch (e) { /* ignore */ }
    setSndUI();
    if (voiceOn) { speak(); if (playing) musicOn(); } else { audio.pause(); clipKey = ""; musicOff(0.4); }
    arm();
  }
  const toggle = () => (playing ? pause() : play());
  function seen() { if (++clicks >= 1) hint.classList.add("gone"); }

  /* input */
  let swiped = false;
  stage.addEventListener("click", e => {
    if (swiped) { swiped = false; return; }
    const act = e.target.closest && e.target.closest("[data-act]");
    if (act && act.dataset.act === "play") { play(); return; }
    if (act && act.dataset.act === "replay") { show(0, 0, "fwd"); play(); return; }
    next(); seen(); arm(); setPlayUI();
  });
  stage.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); next(); seen(); arm(); setPlayUI(); }
  });
  let tx0 = null, ty0 = 0;
  stage.addEventListener("touchstart", e => { const t = e.changedTouches[0]; tx0 = t.clientX; ty0 = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (tx0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - tx0, dy = t.clientY - ty0;
    tx0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiped = true; setTimeout(() => { swiped = false; }, 400);
      if (dx < 0) next(); else prev();
      seen(); arm(); setPlayUI();
    }
  }, { passive: true });
  btnNext.addEventListener("click", () => { next(); seen(); arm(); setPlayUI(); });
  btnPrev.addEventListener("click", () => { prev(); arm(); setPlayUI(); });
  btnPlay.addEventListener("click", toggle);
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    const onButton = /BUTTON|SUMMARY|A/.test(tag);
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !onButton)) { e.preventDefault(); next(); seen(); arm(); setPlayUI(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); arm(); setPlayUI(); }
    else if (e.key === "Home") { show(0, 0, "fwd"); arm(); setPlayUI(); }
    else if (e.key === "End") { show(SCENES.length - 1, SCENES[SCENES.length - 1].steps.length - 1, "back"); pause(); }
    else if (e.key === "p" || e.key === "P") toggle();
    else if (e.key === "m" || e.key === "M") toggleVoice();
    else if (e.key === "c" || e.key === "C") toggleSubs();
  });

  /* full screen */
  const player = document.getElementById("player"), btnFs = document.getElementById("fs");
  const FS_ON = 'Full screen', FS_OFF = 'Exit full screen';
  const fsIcon = on => on
    ? '<path d="M6 2v4H2M10 2v4h4M14 10h-4v4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  const setFs = on => {
    player.classList.toggle("fs", on);
    document.documentElement.classList.toggle("fs-lock", on);
    btnFs.setAttribute("aria-label", on ? FS_OFF : FS_ON);
    btnFs.setAttribute("aria-pressed", on ? "true" : "false");
    btnFs.querySelector("svg").innerHTML = fsIcon(on);
  };
  const toggleFs = () => {
    const on = !player.classList.contains("fs");
    if (on) {
      setFs(true);
      if (player.requestFullscreen) player.requestFullscreen().catch(() => {});
      else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
    } else {
      setFs(false);
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    stage.focus({ preventScroll: true });
  };
  const onFsChange = () => { if (!(document.fullscreenElement || document.webkitFullscreenElement)) setFs(false); };
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  btnFs.addEventListener("click", toggleFs);
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement && document.activeElement.tagName) || "")) return;
    if (e.key === "f" || e.key === "F") { e.preventDefault(); toggleFs(); }
    else if (e.key === "Escape" && player.classList.contains("fs") && !document.fullscreenElement) setFs(false);
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) pause(); });
  const fromHash = () => {
    const id = location.hash.replace(/^#/, "");
    const i = SCENES.findIndex(sc => sc.id === id);
    return i < 0 ? 0 : i;
  };
  window.addEventListener("hashchange", () => { const i = fromHash(); if (i !== cur) { show(i, 0, "fwd"); arm(); } });

  btnSnd.addEventListener("click", toggleVoice);
  setSndUI();
  show(fromHash(), 0, "fwd");
  setPlayUI();
})();
</script>
</body>
</html>
